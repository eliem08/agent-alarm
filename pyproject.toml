[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-alarm"
version = "0.1.0"
description = "ADT for your personal agent: alerts when your agent does something it should not"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-alarm = "agent_alarm.__main__:main"

[tool.setuptools]
packages = ["agent_alarm"]
